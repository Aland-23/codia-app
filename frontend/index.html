    // =====================================================================
    //  RENDERIZADOR PROGRESIVO
    //  Convierte el texto de CodIA (con ```código``` y ```mermaid```) en
    //  elementos del chat MIENTRAS se escribe: los bloques de código nacen
    //  en cuanto aparece su ``` y se van llenando letra por letra, así no hay
    //  el "salto" brusco de texto plano → texto con formato del final.
    // =====================================================================
    function trocear(texto) {
        const segs = [];
        let i = 0;
        while (true) {
            const ini = texto.indexOf('```', i);
            if (ini === -1) { segs.push({ t: 'texto', c: texto.slice(i) }); break; }
            if (ini > i) segs.push({ t: 'texto', c: texto.slice(i, ini) });
            const finLinea = texto.indexOf('\n', ini + 3);
            if (finLinea === -1) { // la cabecera ```lenguaje aún no terminó de llegar
                segs.push({ t: 'codigo', lang: texto.slice(ini + 3).trim().toLowerCase() || 'texto', c: '', cerrado: false });
                break;
            }
            const lang = (texto.slice(ini + 3, finLinea).trim().split(/\s+/)[0] || 'texto').toLowerCase();
            const cierre = texto.indexOf('```', finLinea + 1);
            if (cierre === -1) { segs.push({ t: 'codigo', lang, c: texto.slice(finLinea + 1), cerrado: false }); break; }
            segs.push({ t: 'codigo', lang, c: texto.slice(finLinea + 1, cierre), cerrado: true });
            i = cierre + 3;
        }
        return segs;
    }

    // Formato en línea seguro (sin innerHTML): `código` y **negrita**.
    // Cada palabra nueva se anima al aparecer. Como el párrafo se reconstruye
    // en cada fotograma, guardamos la hora a la que apareció cada letra y le
    // damos a la animación un retraso NEGATIVO igual a su edad: así continúa
    // justo donde iba, sin reiniciarse ni parpadear.
    const DURACION_PALABRA = 650;

    // Escribe texto con formato en línea (`código`, **negrita**, *cursiva*, <br>)
    // DENTRO de `el`. `base` es la posición de este texto dentro del segmento
    // completo, para reutilizar las marcas de tiempo de cada letra.
    const PARTES_EN_LINEA = /(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\s\n][^*\n]*\*|<br\s*\/?>)/i;
    function escribirEnLinea(el, texto, base, marcas, ahora) {
        let buffer = '';
        const volcar = () => { if (buffer) { el.appendChild(document.createTextNode(buffer)); buffer = ''; } };
        const animarNodo = (nodo, edad) => { nodo.classList.add('palabra'); nodo.style.animationDelay = (-edad) + 'ms'; };
        let desplazamiento = base;

        texto.split(PARTES_EN_LINEA).forEach((trozo) => {
            if (!trozo) return;
            const inicio = desplazamiento;
            desplazamiento += trozo.length;
            if (/^<br\s*\/?>$/i.test(trozo)) { volcar(); el.appendChild(document.createElement('br')); return; }
            const esCodigo = trozo.length > 2 && trozo[0] === '`' && trozo[trozo.length - 1] === '`';
            const esNegrita = trozo.length > 4 && trozo.startsWith('**') && trozo.endsWith('**');
            const esCursiva = !esNegrita && trozo.length > 2 && trozo[0] === '*' && trozo[trozo.length - 1] === '*';
            if (esCodigo || esNegrita || esCursiva) {
                volcar();
                const nodo = document.createElement(esCodigo ? 'code' : esNegrita ? 'strong' : 'em');
                if (esCodigo) nodo.className = 'inline';
                nodo.textContent = esCodigo ? trozo.slice(1, -1) : esNegrita ? trozo.slice(2, -2) : trozo.slice(1, -1);
                const edad = ahora - marcas[inicio];
                if (edad < DURACION_PALABRA) animarNodo(nodo, edad);
                el.appendChild(nodo);
                return;
            }
            let pos = inicio;
            trozo.split(/(\s+)/).forEach((w) => {
                if (!w) return;
                const edad = ahora - marcas[pos];
                pos += w.length;
                if (/^\s+$/.test(w) || edad >= DURACION_PALABRA) { buffer += w; return; }
                volcar();
                const sp = document.createElement('span');
                sp.textContent = w;
                animarNodo(sp, edad);
                el.appendChild(sp);
            });
        });
        volcar();
    }

    // ---- Markdown por bloques: títulos, listas, tablas, citas y párrafos ----
    const RE_TITULO = /^(#{1,6})\s+(.*)$/;
    const RE_LISTA = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
    const RE_SEP_TABLA = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
    const RE_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
    const RE_CITA = /^>\s?(.*)$/;

    function celdasDeFila(linea, desde) {
        const celdas = [];
        let ini = 0;
        let fin = linea.length;
        if (linea.trim().startsWith('|')) ini = linea.indexOf('|') + 1;
        if (linea.trim().endsWith('|') && linea.lastIndexOf('|') >= ini) fin = linea.lastIndexOf('|');
        let k = ini;
        while (k <= fin) {
            let sig = linea.indexOf('|', k);
            if (sig === -1 || sig > fin) sig = fin;
            const crudo = linea.slice(k, sig);
            const lead = crudo.length - crudo.replace(/^\s+/, '').length;
            celdas.push({ c: crudo.trim(), o: desde + k + lead });
            k = sig + 1;
        }
        return celdas;
    }

    function parsearMarkdown(texto) {
        const lineas = [];
        let pos = 0;
        texto.split('\n').forEach((l) => { lineas.push({ s: l, o: pos }); pos += l.length + 1; });
        const bloques = [];
        const esInicioDeBloque = (k) => {
            const l = lineas[k];
            if (!l) return false;
            if (!l.s.trim()) return true;
            if (RE_TITULO.test(l.s) || RE_HR.test(l.s) || RE_CITA.test(l.s)) return true;
            if (RE_LISTA.test(l.s)) return true;
            if (l.s.includes('|') && lineas[k + 1] && RE_SEP_TABLA.test(lineas[k + 1].s) && lineas[k + 1].s.includes('-')) return true;
            return false;
        };
        let i = 0;
        while (i < lineas.length) {
            const { s, o } = lineas[i];
            if (!s.trim()) { i++; continue; }
            let m;
            if ((m = RE_TITULO.exec(s))) {
                bloques.push({ t: 'h', n: Math.min(m[1].length, 4), c: m[2].trim(), o: o + s.length - m[2].length });
                i++; continue;
            }
            if (RE_HR.test(s)) { bloques.push({ t: 'hr' }); i++; continue; }
            if (s.includes('|') && lineas[i + 1] && RE_SEP_TABLA.test(lineas[i + 1].s) && lineas[i + 1].s.includes('-')) {
                const cab = celdasDeFila(s, o);
                const filas = [];
                let k = i + 2;
                while (k < lineas.length && lineas[k].s.trim() && lineas[k].s.includes('|')) {
                    filas.push(celdasDeFila(lineas[k].s, lineas[k].o));
                    k++;
                }
                bloques.push({ t: 'tabla', cab, filas });
                i = k; continue;
            }
            if ((m = RE_LISTA.exec(s))) {
                const items = [];
                let k = i;
                while (k < lineas.length) {
                    let mm = RE_LISTA.exec(lineas[k].s);
                    if (!mm) {
                        // una línea en blanco no corta la lista si después sigue otro elemento
                        let j = k;
                        while (j < lineas.length && !lineas[j].s.trim()) j++;
                        if (j > k && j < lineas.length && RE_LISTA.exec(lineas[j].s)) { k = j; continue; }
                        break;
                    }
                    items.push({
                        c: mm[3], o: lineas[k].o + lineas[k].s.length - mm[3].length,
                        ind: mm[1].replace(/\t/g, '    ').length,
                        ord: /\d/.test(mm[2]), num: parseInt(mm[2], 10) || 1,
                    });
                    k++;
                }
                bloques.push({ t: 'lista', items });
                i = k; continue;
            }
            if (RE_CITA.test(s)) {
                const partes = [];
                let k = i;
                while (k < lineas.length && (m = RE_CITA.exec(lineas[k].s))) {
                    partes.push({ c: m[1], o: lineas[k].o + lineas[k].s.length - m[1].length });
                    k++;
                }
                bloques.push({ t: 'cita', partes });
                i = k; continue;
            }
            // párrafo: hasta una línea en blanco u otro tipo de bloque
            let k = i + 1;
            while (k < lineas.length && !esInicioDeBloque(k)) k++;
            const ultima = lineas[k - 1];
            bloques.push({ t: 'p', c: texto.slice(o, ultima.o + ultima.s.length), o });
            i = k;
        }
        return bloques;
    }

    function escribirTextoEnLinea(cont, texto, animar) {
        const ahora = performance.now();
        const marcas = cont._marcas || (cont._marcas = []);
        if (marcas.length > texto.length) marcas.length = texto.length;
        while (marcas.length < texto.length) marcas.push(animar ? ahora : -1e9);

        const frag = document.createDocumentFragment();
        const en = (el, c, o) => { escribirEnLinea(el, c, o, marcas, ahora); return el; };
        parsearMarkdown(texto).forEach((b) => {
            if (b.t === 'h') {
                frag.appendChild(en(document.createElement('h' + (b.n + 1 > 5 ? 5 : b.n + 1)), b.c, b.o)).classList.add('md-titulo');
            } else if (b.t === 'hr') {
                frag.appendChild(document.createElement('hr'));
            } else if (b.t === 'p') {
                frag.appendChild(en(document.createElement('p'), b.c, b.o));
            } else if (b.t === 'lista') {
                const pila = []; // { ind, ord, el }
                b.items.forEach((it) => {
                    while (pila.length && pila[pila.length - 1].ind > it.ind) pila.pop();
                    let tope = pila[pila.length - 1];
                    if (tope && tope.ind === it.ind && tope.ord !== it.ord) { pila.pop(); tope = pila[pila.length - 1]; }
                    if (!tope || tope.ind < it.ind) {
                        const el = document.createElement(it.ord ? 'ol' : 'ul');
                        el.className = 'md-lista';
                        if (tope && tope.el.lastElementChild) tope.el.lastElementChild.appendChild(el);
                        else frag.appendChild(el);
                        tope = { ind: it.ind, ord: it.ord, el };
                        pila.push(tope);
                    }
                    const li = document.createElement('li');
                    if (it.ord) li.value = it.num;
                    tope.el.appendChild(en(li, it.c, it.o));
                });
            } else if (b.t === 'cita') {
                const q = document.createElement('blockquote');
                b.partes.forEach((pt, idx) => { if (idx) q.appendChild(document.createElement('br')); en(q, pt.c, pt.o); });
                frag.appendChild(q);
            } else if (b.t === 'tabla') {
                const envoltorio = document.createElement('div');
                envoltorio.className = 'tabla-wrap';
                const tabla = document.createElement('table');
                const thead = document.createElement('thead');
                const trh = document.createElement('tr');
                b.cab.forEach((c) => trh.appendChild(en(document.createElement('th'), c.c, c.o)));
                thead.appendChild(trh);
                tabla.appendChild(thead);
                const tbody = document.createElement('tbody');
                b.filas.forEach((fila) => {
                    const tr = document.createElement('tr');
                    for (let k = 0; k < b.cab.length; k++) {
                        const c = fila[k];
                        tr.appendChild(c ? en(document.createElement('td'), c.c, c.o) : document.createElement('td'));
                    }
                    tbody.appendChild(tr);
                });
                tabla.appendChild(tbody);
                envoltorio.appendChild(tabla);
                frag.appendChild(envoltorio);
            }
        });
        cont.replaceChildren(frag);
    }

    // Último elemento de texto donde colocar el cursor luminoso
    function hojaDeTexto(el) {
        let x = el;
        while (x.lastElementChild && x.lastElementChild.matches('p,ul,ol,li,table,tbody,thead,tr,td,th,blockquote,h2,h3,h4,h5,div.tabla-wrap')) x = x.lastElementChild;
        return x;
    }

    function crearRenderizador(contenedor, animarBloques) {
        const nodos = [];
        const cursor = document.createElement('span');
        cursor.className = 'cursor-escritura';

        function clave(seg) { return seg.t === 'texto' ? 'texto' : (seg.lang === 'mermaid' ? 'mermaid' : 'codigo:' + seg.lang); }

        function crearNodo(seg) {
            let nodo;
            if (seg.t === 'texto') {
                const p = document.createElement('div');
                p.className = 'md';
                nodo = { clave: 'texto', el: p, ultimo: null, ancla: p };
            } else if (seg.lang === 'mermaid') {
                const div = document.createElement('div');
                div.className = 'bloque-diagrama dibujando';
                div.textContent = 'Dibujando diagrama…';
                nodo = { clave: 'mermaid', el: div, ultimo: null, ancla: null, dibujado: false };
            } else {
                const bloque = crearBloqueCodigo(seg.lang);
                nodo = { clave: 'codigo:' + seg.lang, el: bloque.el, bloque, ultimo: null, ancla: bloque.codeEl };
            }
            if (animarBloques) nodo.el.classList.add('bloque-nuevo');
            contenedor.insertBefore(nodo.el, contenedor.querySelector('.btn-leer') || contenedor.querySelector('.imagen-wrap'));
            return nodo;
        }

        return {
            pintar(texto, final) {
                let segs = trocear(texto);
                if (!final && segs.length) { // evita parpadeos con ``  a medio escribir
                    const u = segs[segs.length - 1];
                    if (u.t === 'texto') u.c = u.c.replace(/`{1,2}$/, '');
                }
                segs = segs.filter((s) => s.t !== 'texto' || s.c.trim() !== '');
                if (segs.length === 0 && !final) segs = [{ t: 'texto', c: '' }];

                segs.forEach((seg, k) => {
                    if (nodos[k] && nodos[k].clave !== clave(seg)) {
                        while (nodos.length > k) nodos.pop().el.remove();
                    }
                    if (!nodos[k]) nodos[k] = crearNodo(seg);
                    const n = nodos[k];
                    const contenido = seg.t === 'texto' ? seg.c.trim() : seg.c;
                    if (n.clave === 'texto') {
                        if (n.ultimo !== contenido) { escribirTextoEnLinea(n.el, contenido, animarBloques); n.ultimo = contenido; }
                    } else if (n.clave === 'mermaid') {
                        if (seg.cerrado && !n.dibujado) {
                            n.dibujado = true;
                            dibujarDiagrama(n.el, contenido);
                        }
                    } else {
                        if (n.ultimo !== contenido) { n.bloque.set(contenido); n.ultimo = contenido; }
                        n.bloque.estado(seg.cerrado || final);
                    }
                });
                while (nodos.length > segs.length) nodos.pop().el.remove();

                // El cursor luminoso va al final del último bloque que acepta texto
                cursor.remove();
                if (!final) {
                    for (let k = nodos.length - 1; k >= 0; k--) {
                        if (nodos[k].ancla) { (nodos[k].clave === 'texto' ? hojaDeTexto(nodos[k].el) : nodos[k].ancla).appendChild(cursor); break; }
                    }
                }
            },
        };
    }

    function dibujarDiagrama(contenedor, definicion) {
        if (!window.mermaid) { contenedor.className = 'bloque-diagrama'; contenedor.textContent = definicion; return; }
        const idDiagrama = `mermaid-${Date.now()}-${contadorDiagramas++}`;
        mermaid.render(idDiagrama, definicion.trim())
            .then(({ svg }) => { contenedor.className = 'bloque-diagrama'; contenedor.innerHTML = svg; scrollAbajo(); })
            .catch(() => {
                const huerfano = document.getElementById('d' + idDiagrama); if (huerfano) huerfano.remove();
                contenedor.className = 'bloque-diagrama error-diagrama';
                contenedor.textContent = 'No se pudo dibujar el diagrama:\n' + definicion;
            });
    }

    // ===== Efecto de escritura fluido =====
    // El servidor manda pedazos a ráfagas irregulares. En vez de pintarlos tal
    // cual (a tirones), los metemos en una cola y los mostramos a ritmo
    // constante con requestAnimationFrame: más rápido si hay mucho acumulado
    // y más calmado si no, para que siempre parezca que alguien escribe.
    function crearEscritor(pintar) {
        let objetivo = '', mostrado = 0, acumulador = 0, ultimaMarca = 0, terminado = false, raf = 0, resolver = null;

        function paso(marca) {
            const dt = Math.min(64, ultimaMarca ? marca - ultimaMarca : 16);
            ultimaMarca = marca;
            const resto = objetivo.length - mostrado;
            if (resto > 0) {
                // caracteres por segundo: base cómoda de leer + aceleración según lo acumulado
                const cps = terminado ? Math.max(500, resto / 0.45) : Math.max(55, resto * 4.5);
                acumulador += (cps * dt) / 1000;
                let n = Math.floor(acumulador);
                if (n > 0) {
                    acumulador -= n;
                    mostrado = Math.min(objetivo.length, mostrado + n);
                    const cod = objetivo.charCodeAt(mostrado - 1);
                    if (cod >= 0xd800 && cod <= 0xdbff && mostrado < objetivo.length) mostrado++; // no cortar emojis
                    pintar(objetivo.slice(0, mostrado), false);
                    scrollAbajo();
                }
            }
            if (terminado && mostrado >= objetivo.length) {
                pintar(objetivo, true);
                scrollAbajo();
                raf = 0;
                if (resolver) resolver();
                return;
            }
            raf = requestAnimationFrame(paso);
        }

        return {
            agregar(texto) {
                objetivo += texto;
                if (reducirMovimiento) { mostrado = objetivo.length; pintar(objetivo, false); scrollAbajo(); return; }
                if (!raf) { ultimaMarca = 0; raf = requestAnimationFrame(paso); }
            },
            terminar() {
                terminado = true;
                return new Promise((res) => {
                    resolver = res;
                    if (reducirMovimiento || !raf) { mostrado = objetivo.length; pintar(objetivo, true); res(); }
                });
            },
            texto() { return objetivo; },
        };
    }

    // opciones: { sinAnimar } para historial; { escribir } para teclear el texto
    function agregarMensajeIA(texto, imagenUrl, opciones) {
        opciones = opciones || {};
        const div = document.createElement('div');
        div.className = 'message ia' + (opciones.sinAnimar ? '' : ' anima');

        if (opciones.escribir && !reducirMovimiento) {

            escritor.agregar(texto);
            escritor.terminar().then(() => { if (fila) fila.classList.remove('escribiendo'); rematar(); });

            render.pintar(texto, true);
            rematar();

        if (!opciones.sinAnimar) scrollSuave();

    // ===== Bloque de código (se va llenando mientras CodIA escribe) =====
    const LENGUAJES_EJECUTABLES = ['python', 'py', 'javascript', 'js', 'typescript', 'ts', 'java', 'c', 'cpp', 'c++', 'csharp', 'c#', 'php', 'ruby', 'rb', 'go'];

    // Resaltado de sintaxis ligero (sin librerías): comentarios, textos,
    // números, palabras clave y llamadas a funciones. Construye nodos DOM,
    // nunca HTML, así que el código mostrado no puede ejecutarse.
    const PALABRAS_CLAVE = new Set(('def class return if elif else for while in not and or is None True False import from as with try except finally raise pass break continue lambda yield global nonlocal assert del async await ' +
        'function var let const new this typeof instanceof null undefined true false switch case default do throw catch export extends super static void public private protected final abstract interface implements package namespace using struct enum ' +
        'int float double char long short boolean string bool String System out println echo print foreach unset begin end then puts fn func range').split(' '));
    const LENGUAJES_HASH = ['python', 'py', 'ruby', 'rb', 'bash', 'sh', 'shell', 'yaml', 'yml', 'toml', 'perl', 'r', 'powershell'];

    function resaltar(codigo, lenguaje) {
        const frag = document.createDocumentFragment();
        const comentario = LENGUAJES_HASH.includes(lenguaje) ? '#[^\\n]*' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?(?:\\*\\/|$)';
        const re = new RegExp('(' + comentario + ')|("(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?|`(?:\\\\.|[^`\\\\])*`?)|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b[A-Za-z_]\\w*\\b)', 'g');
        let ultimo = 0, m;
        const poner = (texto, clase) => {
            if (!clase) { frag.appendChild(document.createTextNode(texto)); return; }
            const sp = document.createElement('span'); sp.className = clase; sp.textContent = texto; frag.appendChild(sp);
        };
        while ((m = re.exec(codigo)) !== null) {
            if (m.index > ultimo) poner(codigo.slice(ultimo, m.index));
            if (m[1]) poner(m[0], 'tk-c');
            else if (m[2]) poner(m[0], 'tk-s');
            else if (m[3]) poner(m[0], 'tk-n');
            else {
                const palabra = m[4];
                const siguiente = codigo[re.lastIndex];
                if (PALABRAS_CLAVE.has(palabra)) poner(palabra, 'tk-k');
                else if (siguiente === '(') poner(palabra, 'tk-f');
                else if (/^[A-Z][A-Za-z0-9]*$/.test(palabra) && palabra.length > 1) poner(palabra, 'tk-t');
                else poner(palabra);
            }
            ultimo = re.lastIndex;
        }
        if (ultimo < codigo.length) poner(codigo.slice(ultimo));
        return frag;
    }

    function crearBloqueCodigo(lenguaje) {
        let codigo = '';
        const contenedor = document.createElement('div');
        contenedor.className = 'bloque-codigo abierto';
        const header = document.createElement('div');
        header.className = 'bloque-codigo-header';
        const etiqueta = document.createElement('span');
        etiqueta.className = 'etiqueta-lenguaje';
        etiqueta.textContent = lenguaje;
        header.appendChild(etiqueta);

        const acciones = document.createElement('div');
        acciones.className = 'acciones';
        const btnCopiar = document.createElement('button');
        btnCopiar.textContent = '📋 Copiar';
        btnCopiar.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(codigo); btnCopiar.textContent = '✅ Copiado'; }
            catch (e) { btnCopiar.textContent = '⚠ No se pudo'; }
            setTimeout(() => (btnCopiar.textContent = '📋 Copiar'), 1500);
        });
        acciones.appendChild(btnCopiar);

        const soportado = LENGUAJES_EJECUTABLES.includes(lenguaje.toLowerCase());
        const btnEjecutar = document.createElement('button');
        btnEjecutar.textContent = '▶ Ejecutar';
        btnEjecutar.disabled = true;
        acciones.appendChild(btnEjecutar);
        header.appendChild(acciones);
        contenedor.appendChild(header);

        const pre = document.createElement('pre');
        const code = document.createElement('code');
        pre.appendChild(code);
        contenedor.appendChild(pre);

        let cerrado = false;
        const puedeEjecutar = () => cerrado && soportado && capacidades.ejecutar_codigo_disponible;

        btnEjecutar.addEventListener('click', async () => {
            btnEjecutar.disabled = true;
            btnEjecutar.textContent = 'Ejecutando...';
            let salidaDiv = contenedor.querySelector('.salida-codigo');
            if (!salidaDiv) { salidaDiv = document.createElement('div'); salidaDiv.className = 'salida-codigo'; contenedor.appendChild(salidaDiv); }
            const btnCorregirPrevio = contenedor.querySelector('.btn-corregir');
            if (btnCorregirPrevio) btnCorregirPrevio.remove();

            try {
                const res = await fetch(`${API_URL}/api/ejecutar-codigo`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lenguaje, codigo }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al ejecutar');

                if (data.error) {
                    salidaDiv.className = 'salida-codigo err';
                    salidaDiv.textContent = data.error;
                    const btnCorregir = document.createElement('button');
                    btnCorregir.className = 'btn-corregir';
                    btnCorregir.textContent = '🩹 Corregir con IA';
                    btnCorregir.addEventListener('click', () => {
                        btnCorregir.disabled = true;
                        btnCorregir.textContent = 'Pidiendo corrección...';
                        const promptInterno = `Este código en ${lenguaje} me dio un error al ejecutarlo. Corrígelo y explica en 1-2 frases qué estaba mal.\n\nCódigo:\n\`\`\`${lenguaje}\n${codigo}\n\`\`\`\n\nError:\n${data.error}`;
                        enviarMensajeInterno(promptInterno, '🩹 Pedí que CodIA corrija este error');
                    });
                    contenedor.appendChild(btnCorregir);
                } else {
                    salidaDiv.className = 'salida-codigo ok';
                    salidaDiv.textContent = data.salida || '(sin salida)';
                }
            } catch (e) {
                salidaDiv.className = 'salida-codigo err';
                salidaDiv.textContent = 'No se pudo ejecutar: ' + e.message;
            } finally {
                btnEjecutar.disabled = !puedeEjecutar();
                btnEjecutar.textContent = '▶ Ejecutar';
                scrollAbajo();
            }
        });

        return {
            el: contenedor,
            codeEl: code,
            set(c) { codigo = c; code.replaceChildren(resaltar(c.replace(/\n$/, ''), lenguaje.toLowerCase())); },
            estado(yaCerrado) { // true cuando llegó el ``` de cierre
                if (cerrado === yaCerrado) return;
                cerrado = yaCerrado;
                contenedor.classList.toggle('abierto', !cerrado);
                if (cerrado && !reducirMovimiento) { contenedor.classList.add('cierre'); setTimeout(() => contenedor.classList.remove('cierre'), 950); }
                btnEjecutar.disabled = !puedeEjecutar();
            },
        };
    }

    // ===== Funciones compartidas: procesar un archivo venga de donde venga
    // (el selector de archivos, pegar con Ctrl+V, o arrastrar y soltar) =====
    function procesarArchivoImagen(archivo) {
        documentoPendiente = null;
        const lector = new FileReader();
        lector.onload = () => {
            const base64 = lector.result.split(',')[1];
            imagenPendiente = { base64, mime: archivo.type, nombre: archivo.name || 'imagen-pegada.png' };
            previewAdjuntoThumb.src = lector.result;
            previewAdjuntoThumb.style.display = 'block';
            previewAdjuntoNombre.textContent = archivo.name || 'Imagen pegada';
            mostrarBarra(previewAdjunto, true);
            userInput.focus();
        };
        lector.readAsDataURL(archivo);
    }

    function procesarArchivoDocumento(archivo) {
        imagenPendiente = null;
        const lector = new FileReader();
        lector.onload = () => {
            const base64 = lector.result.split(',')[1];
            documentoPendiente = { base64, mime: archivo.type, nombre: archivo.name };
            previewAdjuntoThumb.style.display = 'none';
            previewAdjuntoNombre.textContent = '📄 ' + archivo.name;
            mostrarBarra(previewAdjunto, true);
            userInput.focus();
        };
        lector.readAsDataURL(archivo);
    }

    function esDocumentoValido(archivo) {
        const nombre = (archivo.name || '').toLowerCase();
        return nombre.endsWith('.pdf') || nombre.endsWith('.docx');
    }

    btnAdjuntarImagen.addEventListener('click', () => inputImagen.click());
    inputImagen.addEventListener('change', () => { const a = inputImagen.files[0]; if (a) procesarArchivoImagen(a); });
    btnAdjuntarDocumento.addEventListener('click', () => inputDocumento.click());
    inputDocumento.addEventListener('change', () => { const a = inputDocumento.files[0]; if (a) procesarArchivoDocumento(a); });

    // Pegar imágenes con Ctrl+V directo en el campo de texto
    userInput.addEventListener('paste', (evento) => {
        const items = evento.clipboardData && evento.clipboardData.items;
        if (!items) return;
        for (const item of items) {
            if (item.type && item.type.startsWith('image/')) {
                evento.preventDefault();
                const archivo = item.getAsFile();
                if (archivo) procesarArchivoImagen(archivo);
                break;
            }
        }
    });

    // Arrastrar y soltar imágenes o documentos sobre el chat
    const zonaArrastre = document.querySelector('.main-chat');
    ['dragenter', 'dragover'].forEach((evt) => {
        zonaArrastre.addEventListener(evt, (e) => { e.preventDefault(); zonaArrastre.classList.add('arrastrando-archivo'); });
    });
    ['dragleave', 'dragend'].forEach((evt) => {
        zonaArrastre.addEventListener(evt, (e) => { e.preventDefault(); zonaArrastre.classList.remove('arrastrando-archivo'); });
    });
    zonaArrastre.addEventListener('drop', (e) => {
        e.preventDefault();
        zonaArrastre.classList.remove('arrastrando-archivo');
        const archivo = e.dataTransfer.files && e.dataTransfer.files[0];
        if (!archivo) return;
        if (archivo.type && archivo.type.startsWith('image/')) procesarArchivoImagen(archivo);
        else if (esDocumentoValido(archivo)) procesarArchivoDocumento(archivo);
        else alert('Solo se pueden arrastrar imágenes o archivos .pdf / .docx');
    });

    btnQuitarAdjunto.addEventListener('click', () => {
        imagenPendiente = null; documentoPendiente = null;
        inputImagen.value = ''; inputDocumento.value = '';
        previewAdjunto.style.display = 'none';
    });

    // ===== Modo generar imagen =====
    btnModoImagen.addEventListener('click', () => {
        modoGenerarImagen = true;
        btnModoImagen.classList.add('activo');
        mostrarBarra(barraModoImagen, true);
        userInput.placeholder = 'Describe la imagen que quieres generar...';
        userInput.focus();
    });
    function salirModoImagen() {
        modoGenerarImagen = false;
        btnModoImagen.classList.remove('activo');
        barraModoImagen.style.display = 'none';
        userInput.placeholder = 'Escribe tu mensaje...';
    }
    btnCancelarModoImagen.addEventListener('click', salirModoImagen);

    async function generarImagen(prompt) {
        agregarMensajeUsuario(`🎨 Genera una imagen: ${prompt}`);
        sendBtn.disabled = true;

        // Tarjeta animada en el lugar donde aparecerá la imagen
        const burbuja = document.createElement('div');
        burbuja.className = 'message ia anima';
        const tarjeta = document.createElement('div');
        tarjeta.className = 'generando-imagen';
        tarjeta.innerHTML = '<div class="chispa">✨</div><div class="texto-gen">Creando tu imagen…</div>';
        burbuja.appendChild(tarjeta);
        ponerFilaIA(burbuja);
        scrollSuave();

        try {
            const res = await fetch(`${API_URL}/api/generar-imagen`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id: usuarioId, conversacion_id: conversacionActualId, prompt }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'No se pudo generar la imagen');
            const texto = `Aquí tienes la imagen que pediste: "${prompt}"`;
            burbuja.replaceChildren();
            const render = crearRenderizador(burbuja, false);
            render.pintar(texto, true);
            burbuja.appendChild(crearImagen(`${API_URL}${data.imagen_url}`, prompt));
            agregarBotonLeer(burbuja, texto);
            scrollAbajo();
            await cargarListaConversaciones();
        } catch (error) {
            (burbuja.closest('.fila-ia') || burbuja).remove();
            mostrarError(`No se pudo generar la imagen: ${error.message}`);
        } finally {
            sendBtn.disabled = false;
            salirModoImagen();
        }
    }

    // ===== Envío central de mensajes de texto/imagen/documento =====
    async function enviarMensajeInterno(textoParaLaIA, textoParaMostrar) {
        const srcImagen = imagenPendiente ? previewAdjuntoThumb.src : null;
        agregarMensajeUsuario(textoParaMostrar, srcImagen, documentoPendiente ? documentoPendiente.nombre : null);

        const cuerpo = {
            usuario_id: usuarioId,
            conversacion_id: conversacionActualId,
            mensaje: textoParaLaIA,
            imagen_base64: imagenPendiente ? imagenPendiente.base64 : null,
            imagen_mime: imagenPendiente ? imagenPendiente.mime : null,
            documento_base64: documentoPendiente ? documentoPendiente.base64 : null,
            documento_mime: documentoPendiente ? documentoPendiente.mime : null,
            documento_nombre: documentoPendiente ? documentoPendiente.nombre : null,
        };

        imagenPendiente = null; documentoPendiente = null;
        inputImagen.value = ''; inputDocumento.value = '';
        previewAdjunto.style.display = 'none';
        sendBtn.disabled = true;
        mostrarEscribiendo();

        try {
            const res = await fetch(`${API_URL}/api/chat/stream`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cuerpo),
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.detail || `Error del servidor (${res.status})`);
            }

            if (!res.body || !res.body.getReader) {
                // Navegador sin streaming de fetch: leemos todo de una vez
                const textoCompleto = await res.text();
                quitarEscribiendo();
                agregarMensajeIA(textoCompleto, null, { escribir: true });
                leerEnVozAlta(textoCompleto);
            } else {
                const lector = res.body.getReader();
                const decodificador = new TextDecoder('utf-8');
                let div = null, escritor = null, filaStream = null;

                while (true) {
                    const { done, value } = await lector.read();
                    if (done) break;
                    const pedazo = decodificador.decode(value, { stream: true });
                    if (!pedazo) continue;
                    if (!escritor) {
                        // Los puntitos siguen visibles hasta que llega la PRIMERA letra
                        quitarEscribiendo();
                        div = document.createElement('div');
                        div.className = 'message ia anima';
                        filaStream = ponerFilaIA(div);
                        filaStream.classList.add('escribiendo');
                        const render = crearRenderizador(div, true);
                        escritor = crearEscritor((t, fin) => render.pintar(t, fin));
                    }
                    escritor.agregar(pedazo);
                }

                quitarEscribiendo();
                if (escritor) {
                    escritor.agregar(decodificador.decode()); // vacía el decodificador
                    await escritor.terminar();
                    if (filaStream) filaStream.classList.remove('escribiendo');
                    const textoCompleto = escritor.texto();
                    agregarBotonLeer(div, textoCompleto);
                    scrollAbajo();
                    leerEnVozAlta(textoCompleto);
                }
            }

            await cargarListaConversaciones();
        } catch (error) {
            quitarEscribiendo();
            mostrarError(`No se pudo obtener respuesta: ${error.message}`);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    async function enviarMensaje() {
        const texto = userInput.value.trim();
        if (texto === '' && !imagenPendiente && !documentoPendiente) return;
        if (sendBtn.disabled) return; // ya hay una respuesta en curso
        userInput.value = '';
        if (!conversacionActualId) {
            // Si el servidor aún estaba despertando, creamos el chat ahora
            sendBtn.disabled = true;
            try { conversacionActualId = (await crearConversacion()).id; }
            catch (e) { userInput.value = texto; sendBtn.disabled = false; mostrarError('El servidor sigue despertando. Intenta de nuevo en unos segundos.'); return; }
            sendBtn.disabled = false;
        }
        if (modoGenerarImagen) { generarImagen(texto); return; }
        enviarMensajeInterno(texto, texto);
    }

    sendBtn.addEventListener('click', enviarMensaje);
    userInput.addEventListener('keydown', (evento) => { if (evento.key === 'Enter') enviarMensaje(); });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }

    iniciar();

    // ===== Temas =====
    (function () {
        const raiz = document.documentElement;
        const btn = document.getElementById('btnTema');
        const menu = document.getElementById('menuTema');
        const meta = document.querySelector('meta[name="theme-color"]');
        const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
        let elegido = 'auto';
        try { elegido = localStorage.getItem('codia_tema') || 'auto'; } catch (e) {}
        function aplicar(t) {
            elegido = t;
            const real = t === 'auto' ? ((mq && mq.matches) ? 'claro' : 'oscuro') : t;
            raiz.setAttribute('data-tema', real);
            try { localStorage.setItem('codia_tema', t); } catch (e) {}
            const fondo = getComputedStyle(raiz).getPropertyValue('--s0').trim();
            if (meta && fondo) meta.setAttribute('content', fondo);
            menu.querySelectorAll('.opcion-tema').forEach(o => o.classList.toggle('activo', o.dataset.tema === t));
        }
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const abierto = menu.classList.toggle('abierto');
            btn.setAttribute('aria-expanded', abierto);
        });
        menu.addEventListener('click', e => {
            const o = e.target.closest('.opcion-tema');
            if (!o) return;
            aplicar(o.dataset.tema);
            menu.classList.remove('abierto');
        });
        document.addEventListener('click', () => menu.classList.remove('abierto'));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') menu.classList.remove('abierto'); });
        if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (elegido === 'auto') aplicar('auto'); });
        aplicar(elegido);
    })();
</script>
